services:
  # The image runs as the unprivileged `node` user (uid 1000), but the files in
  # an existing volume were written by root when the API ran as root. This hands
  # them over before the site starts, or it could not read the answer secret.
  # Same job as the init container in FAF's cluster chart. Runs once and exits.
  data-owner:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    restart: "no"
    volumes:
      - daily-secret:/data

  # The site and the answer API in one container. The service keeps the name
  # `web` and host port 8081, so the edge reverse proxy needs no changes.
  # On first run it generates a random answer secret and keeps it in the volume
  # below. To pin it yourself instead, uncomment DAILY_SECRET.
  web:
    build: .
    restart: unless-stopped
    depends_on:
      data-owner:
        condition: service_completed_successfully
    environment:
      - PORT=8090
      # - DAILY_SECRET=change-me-to-a-long-random-string
    volumes:
      - daily-secret:/data
    ports:
      - "8081:8090"

volumes:
  daily-secret:
